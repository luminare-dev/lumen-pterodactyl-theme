# The extension on a real panel: build the .blueprint package, check the shared token code and
# the PHP/TypeScript parity, then boot Pterodactyl (pinned image) with Blueprint (pinned release),
# MariaDB, Redis and a mock Wings daemon, install the package with `blueprint -install`, seed
# example data and take screenshots of the client and admin area in dark and light mode
# (artifacts "lumen-blueprint" and "screenshots"). Versions: ci/versions.env.
name: panel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: panel-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Shared token code matches lumen-hydrodactyl-theme (lock and source)
        run: python3 scripts/check_shared.py fetch

      - name: Build the browser modules and the package
        run: |
          php --version | head -n 1
          node --version
          node --no-warnings scripts/build-js.mjs
          python3 scripts/build_blueprint.py --out dist

      - name: Lumen tests (parity, palette mapping, package)
        run: python3 -m unittest tests.test_lumen -v

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-blueprint
          path: dist/lumen.blueprint
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: e2e
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Take the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lumen-blueprint
          path: dist

      - name: Build Pterodactyl with Blueprint (pinned)
        run: |
          set -a
          # shellcheck disable=SC1091
          . ci/versions.env
          set +a
          docker build -t pterodactyl-blueprint:ci \
            --build-arg PANEL_IMAGE="$PANEL_IMAGE" \
            --build-arg BLUEPRINT_VERSION="$BLUEPRINT_VERSION" \
            --build-arg BLUEPRINT_SHA256="$BLUEPRINT_SHA256" \
            ci

      - name: Boot the panel with MariaDB, Redis and the mock daemon
        run: |
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "HASHIDS_SALT=$(openssl rand -hex 10)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
          } > ci/.env
          echo "SEED_PASSWORD=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          docker compose -f ci/docker-compose.yml --env-file ci/.env up -d
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://localhost:8080/auth/login; then
              echo "up after ${i}x2s"
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8080/auth/login

      - name: Install the extension (blueprint -install lumen)
        run: |
          dc="docker compose -f ci/docker-compose.yml --env-file ci/.env"
          $dc cp dist/lumen.blueprint panel:/app/lumen.blueprint
          $dc exec -T panel bash -c 'cd /app && yes | blueprint -install lumen' | tee "$RUNNER_TEMP/install.log"
          $dc exec -T panel bash -c 'ls -la /app/public/extensions/ /app/resources/views/blueprint/dashboard/wrappers/'
          curl -fsS http://localhost:8080/extensions/lumen/boot.js -o /dev/null
          curl -fsS http://localhost:8080/auth/login | grep -q 'id="lumen-tokens"'

      - name: Seed example data
        run: |
          set -o pipefail
          dc="docker compose -f ci/docker-compose.yml --env-file ci/.env"
          $dc cp ci/seed.php panel:/app/ci-seed.php
          $dc exec -T -e SEED_PASSWORD panel php /app/ci-seed.php | tee "$RUNNER_TEMP/seed.log"
          echo "SERVER_ID=$(tail -n 1 "$RUNNER_TEMP/seed.log")" >> "$GITHUB_ENV"

      - name: Screenshots (Playwright, Chromium)
        run: |
          cd ci/playwright
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium >/dev/null
          node screenshots.mjs http://localhost:8080 "$GITHUB_WORKSPACE/screenshots" "$SERVER_ID"

      - name: Panel logs
        if: always()
        run: |
          dc="docker compose -f ci/docker-compose.yml --env-file ci/.env"
          {
            cat "$RUNNER_TEMP/install.log" 2>/dev/null || true
            $dc logs --tail 200 panel wings
            $dc exec -T panel sh -c 'tail -n 200 /app/storage/logs/*.log'
          } > screenshots-panel.log 2>&1 || true
          tail -n 80 screenshots-panel.log

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            screenshots/
            screenshots-panel.log
          if-no-files-found: warn
          retention-days: 30
